<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 56" width="176" height="56" role="img" aria-label="NomaDim">
  <!-- "Noma" light + "Dim" medium; textLength pins the width so the red node lands exactly at the wordmark end regardless of the resolved font. -->
  <text
    x="0"
    y="42"
    textLength="150"
    lengthAdjust="spacing"
    font-family="Barlow, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="38"
    fill="#0d1b2a"
  ><tspan font-weight="300">Noma</tspan><tspan font-weight="500">Dim</tspan></text>
  <circle cx="162" cy="37" r="6" fill="#e5342e" />
</svg>
